# Mensajes de consola de PayDay en español.
prefix: '[PayDay]'
type:
  day: Día
  noon: Mediodía
  night: Noche
  dawn: Amanecer
  dusk: Atardecer
  clear: Cielo despejado
  rain: Lluvia
  storm: Tormenta
message:
  no_console: '&cEste comando solo puede ejecutarlo un jugador.'
  no_permission: '&cNo tienes permiso para usar este comando.'
  not_enough_money: '&cNo tienes suficiente dinero. Necesitas: &6{cost}'
  current_balance: '&cSaldo actual: &6{balance}'
  payday_success: '&aHas pagado &6{cost}&a. Tiempo ajustado a día.'
  purchase_balance: '&aSaldo restante: &6{balance}'
