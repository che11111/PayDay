  database_missing: SQLite JDBC no está disponible. PayDay se ha desactivado.
  price: 'Precio de {type}: {cost}'
  payday_purchase: '{player} pagó {cost} para ajustar el tiempo a día.'
  payweather_purchase: '{player} pagó {cost} para ajustar el clima a despejado.'
  reload: '{player} recargó la configuración de PayDay.'
